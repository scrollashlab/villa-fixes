[project]
name = "tifxyz-audit"
version = "0.1.0"
description = "Audit tifxyz mesh metadata for scale/frame ambiguity and basic QA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scroll Ash Lab", email = "scrollash.lab@gmail.com" }]
dependencies = []

[project.optional-dependencies]
tiff = ["numpy", "tifffile"]
dev = ["pytest", "numpy", "tifffile"]

[project.scripts]
tifxyz-audit = "tifxyz_audit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tifxyz_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
